<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DividendTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06091A;--card:#0C1330;--el:#121D3A;--border:#1C2E52;
  --gold:#E8B84B;--goldD:#B88A20;--green:#10B981;--red:#EF4444;--blue:#3B82F6;
  --text:#E8EDF5;--muted:#6A8AAE;--dim:#2A4060;
  --font:'Inter',-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono','Fira Mono','Consolas',monospace;
}
body{background:var(--bg);font-family:var(--font);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--card)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
input,select,button{font-family:inherit}
input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:var(--border);outline:none;cursor:pointer;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid var(--bg);background:var(--gold)}
select option{background:var(--el);color:var(--text)}

/* LAYOUT */
#app{min-height:100vh}
#header{background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;position:sticky;top:0;z-index:100}
#header-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--gold),var(--goldD));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#06091A;flex-shrink:0}
.logo-name{font-weight:800;font-size:15px;line-height:1.15}
.logo-sub{color:var(--muted);font-size:9px;font-family:var(--mono);letter-spacing:.08em}
nav{display:flex;gap:2px;background:var(--el);border-radius:10px;padding:3px;border:1px solid var(--border)}
.tab-btn{display:flex;align-items:center;gap:5px;background:transparent;color:var(--muted);border:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:12px;transition:all .15s;white-space:nowrap}
.tab-btn.active{background:var(--gold);color:#06091A}
.tab-btn:hover:not(.active){color:var(--text)}
.header-stat{text-align:right;flex-shrink:0}
.header-val{color:var(--green);font-size:13px;font-weight:700;font-family:var(--mono)}
.header-lbl{color:var(--dim);font-size:9px;font-family:var(--mono)}
#content{max-width:1240px;margin:0 auto;padding:20px 20px 48px}
.page{display:none}.page.active{display:block}

/* CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;border-top-width:2px}
.stat-lbl{color:var(--muted);font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-family:var(--mono);margin-bottom:6px}
.stat-val{font-size:22px;font-weight:700;font-family:var(--mono);line-height:1.1}
.stat-sub{color:var(--dim);font-size:10px;margin-top:5px;line-height:1.4}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.panel-title{color:var(--text);font-size:13px;font-weight:700;margin-bottom:12px}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:12px}

/* TABLE */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:11px 13px;color:var(--muted);font-size:9px;font-family:var(--mono);letter-spacing:.1em;text-align:left;text-transform:uppercase;white-space:nowrap;background:var(--el);border-bottom:1px solid var(--border)}
td{padding:10px 13px;border-bottom:1px solid #1C2E5218;transition:background .12s;font-size:12px}
tr:hover td{background:#121D3A90}

/* BADGES */
.tag{border-radius:5px;padding:2px 7px;font-size:10px;font-family:var(--mono);font-weight:700;white-space:nowrap;border:1px solid transparent}

/* BUTTONS */
.btn{border-radius:9px;cursor:pointer;font-weight:700;font-size:14px;padding:9px 18px;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{transform:translateY(-1px);opacity:.9}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--goldD));color:#06091A}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.btn-sm{font-size:12px;padding:5px 11px}
.act-btn{background:var(--el);border:1px solid var(--border);border-radius:7px;padding:5px 10px;color:var(--muted);cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.act-btn:hover{border-color:var(--gold);color:var(--gold)}
.del-btn{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.28);border-radius:7px;padding:5px 10px;color:var(--red);cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;transition:background .15s;display:inline-flex;align-items:center;gap:4px}
.del-btn:hover{background:rgba(239,68,68,.22)}

/* FORM */
.field{margin-bottom:13px}
.field label{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px;font-family:var(--mono)}
.field input,.field select{width:100%;background:var(--el);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus{border-color:var(--gold)}
.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.hint{background:var(--el);border-radius:8px;padding:8px 12px;color:var(--muted);font-size:10px;margin-bottom:10px;margin-top:2px}
.info-bar{background:var(--el);border-radius:9px;padding:9px 13px;margin-bottom:14px;color:var(--muted);font-size:11px;border-left:3px solid var(--gold)}

/* MODAL */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(6,9,26,.92);backdrop-filter:blur(6px);z-index:999;align-items:center;justify-content:center;padding:16px}
#modal-overlay.open{display:flex}
#modal-box{background:var(--card);border:1px solid var(--border);border-radius:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,.7)}
#modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
#modal-title{color:var(--text);font-size:16px;font-weight:700}
#modal-close{background:var(--el);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:18px;padding:3px 10px;border-radius:8px;transition:color .15s}
#modal-close:hover{color:var(--text)}
#modal-body{padding:22px}

/* YEAR SWITCHER */
.yr-bar{display:flex;gap:3px;background:var(--el);border-radius:9px;padding:3px;border:1px solid var(--border)}
.yr-btn{background:transparent;color:var(--muted);border:none;border-radius:7px;padding:4px 13px;cursor:pointer;font-weight:700;font-size:12px;font-family:var(--mono);transition:all .15s}
.yr-btn.active{background:var(--gold);color:#06091A}

/* TABS */
.tab-bar{display:flex;border-radius:12px 12px 0 0;overflow:hidden;border:1px solid var(--border);border-bottom:none}
.tab-bar button{flex:1;padding:11px 0;background:var(--el);border:none;color:var(--muted);cursor:pointer;font-weight:700;font-size:13px;font-family:inherit;transition:all .2s}
.tab-bar button.active{background:var(--card);color:var(--gold)}
.tab-bar button:first-child{border-right:1px solid var(--border)}
.tab-content{background:var(--card);border:1px solid var(--border);border-radius:0 0 13px 13px;overflow:hidden;margin-bottom:0}

/* EMPTY STATE */
.empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.empty .btn{margin-top:12px}

/* MINI CARDS */
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:14px}
.mini-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 16px;border-top-width:2px}
.mini-lbl{color:var(--muted);font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.mini-val{font-size:20px;font-weight:700;font-family:var(--mono)}

/* RANKING */
.rank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.rank-card{background:var(--el);border-radius:10px;padding:12px 14px}
.rank-nemo{font-size:10px;font-family:var(--mono);font-weight:700;margin-bottom:4px}
.rank-val{font-size:16px;font-weight:700;font-family:var(--mono);color:var(--text)}
.rank-pct{color:var(--muted);font-size:9px;margin-top:3px}

/* PROJ PARAMS */
.proj-wrap{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start}
.proj-params{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.proj-title{color:var(--gold);font-size:11px;font-family:var(--mono);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
.range-row{display:flex;justify-content:space-between;color:var(--dim);font-size:9px;margin-top:2px}
.range-mid{color:var(--muted);font-family:var(--mono);font-weight:700}
.checkbox-row{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--el);border-radius:9px;cursor:pointer;margin-bottom:14px;user-select:none;border:1px solid var(--border);transition:border-color .2s}
.checkbox-box{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;font-size:12px;font-weight:700;color:#06091A}
.checkbox-lbl{font-size:12px;color:var(--muted);transition:color .2s}
.proj-summary{background:var(--el);border-radius:10px;padding:12px 14px;border:1px solid var(--border)}
.proj-sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.proj-sum-lbl{color:var(--dim);font-size:8px;font-family:var(--mono);text-transform:uppercase}
.proj-sum-val{font-size:13px;font-weight:700;font-family:var(--mono)}
.legend{display:flex;gap:16px;justify-content:center;margin:8px 0 16px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.legend-dot{width:10px;height:10px;border-radius:2px}

/* OPACITY ON INACTIVE */
.dimmed{opacity:.45}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.cal-month{background:var(--el);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:default;transition:all .15s;position:relative;min-height:110px}
.cal-month:hover{background:#18254a;border-color:var(--border)}
.cal-month.cur{background:rgba(232,184,75,.08);border-color:var(--gold)}
.cal-month.past{opacity:.55}
.cal-month.has-pay{border-left:3px solid var(--green)}
.cal-month-lbl{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--muted);margin-bottom:8px}
.cal-month.cur .cal-month-lbl{color:var(--gold)}
.cal-now-badge{position:absolute;top:8px;right:10px;font-size:8px;font-family:var(--mono);font-weight:700;color:var(--gold);letter-spacing:.08em;background:rgba(232,184,75,.15);border-radius:4px;padding:2px 5px}
.cal-dots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.cal-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.cal-amt{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--text)}
.cal-none{font-family:var(--mono);font-size:10px;color:var(--dim)}
.cal-bar-wrap{background:var(--border);border-radius:3px;height:3px;margin-top:6px;overflow:hidden}
.cal-bar{height:100%;border-radius:3px;transition:width .4s}
.cal-detail{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px 18px;margin-bottom:14px}
.cal-inst-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)18}
.cal-inst-row:last-child{border-bottom:none}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cal-legend-item{display:flex;align-items:center;gap:5px;background:var(--el);border-radius:6px;padding:3px 9px;border:1px solid var(--border)}

/* TOOLTIP */
#tooltip{position:fixed;pointer-events:none;z-index:9999;background:#0C1330;border:1px solid #1C2E52;border-radius:9px;padding:8px 13px;font-size:12px;font-family:var(--mono);color:#E8EDF5;box-shadow:0 8px 28px rgba(0,0,0,.6);white-space:nowrap;opacity:0;transition:opacity .1s;max-width:220px}
#tooltip .tip-lbl{color:#6A8AAE;font-size:10px;margin-bottom:3px}
#tooltip .tip-val{color:#E8B84B;font-weight:700;font-size:14px}
#tooltip .tip-row{display:flex;align-items:center;gap:6px;margin-bottom:2px}
#tooltip .tip-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
</style>
</head>

// ── TOOLTIP ENGINE ────────────────────────────────────────────────────────────
const TIPDATA = {}; // key -> {lbl, rows}
let _tipKey = 0;
function regTip(lbl, rows){ const k='t'+(++_tipKey); TIPDATA[k]={lbl,rows}; return k; }

(function(){
  const tip=document.getElementById('tooltip');

  function showTip(e, lbl, rows){
    document.getElementById('tip-lbl').textContent=lbl||'';
    const rc=document.getElementById('tip-rows');
    rc.innerHTML=rows.map(r=>`<div class="tip-row">
      ${r.color?`<div class="tip-dot" style="background:${r.color}"></div>`:''}
      <span style="color:${r.color||'#E8B84B'};font-weight:700;font-size:13px">${r.val}</span>
      ${r.name?`<span style="color:#6A8AAE;font-size:10px">${r.name}</span>`:''}
    </div>`).join('');
    moveTip(e);
    tip.style.opacity='1';
  }

  function moveTip(e){
    const W=tip.offsetWidth||160, H=tip.offsetHeight||60;
    let x=e.clientX+14, y=e.clientY-H/2;
    if(x+W>window.innerWidth-8) x=e.clientX-W-14;
    if(y<8) y=8;
    if(y+H>window.innerHeight-8) y=window.innerHeight-H-8;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  }

  function hideTip(){ tip.style.opacity='0'; }

  document.addEventListener('mousemove', e=>{
    const t=e.target.closest('[data-tid]');
    if(t){
      const d=TIPDATA[t.getAttribute('data-tid')];
      if(d) showTip(e, d.lbl, d.rows);
    } else {
      hideTip();
    }
  });
  document.addEventListener('mouseleave', hideTip);
})();

// ── SVG CHARTS ───────────────────────────────────────────────────────────────
function svgBarChart(data, lKey='lbl', vKey='amt', color='#E8B84B', h=180){
  const vals=data.map(d=>d[vKey]||0), maxV=Math.max(...vals,1);
  const W=560,H=h,pL=48,pB=28,pT=8,pR=8;
  const cW=W-pL-pR, cH=H-pB-pT;
  const n=data.length, gap=cW/Math.max(n,1);
  const bW=Math.max(6,gap*0.65);
  const fmtY=v=>v>=1e6?`${(v/1e6).toFixed(1)}M`:v>=1000?`${Math.round(v/1000)}K`:`${Math.round(v)}`;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;overflow:visible">`;
  for(let i=0;i<=4;i++){
    const y=pT+cH*(1-i/4);
    s+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="#1C2E52" stroke-width="1"/>`;
    s+=`<text x="${pL-6}" y="${y+4}" text-anchor="end" fill="#6A8AAE" font-size="9">${fmtY(maxV*i/4)}</text>`;
  }
  data.forEach((d,i)=>{
    const v=d[vKey]||0, bh=Math.max(2,(v/maxV)*cH);
    const bx=pL+gap*i+(gap-bW)/2, by=pT+cH-bh;
    const fill=v>0?color:'#1C2E5260';
    const lbl=String(d[lKey]||'');
    const tid=regTip(lbl, [{val:$(v), color:v>0?color:'#6A8AAE'}]);
    s+=`<rect x="${bx.toFixed(1)}" y="${pT}" width="${bW.toFixed(1)}" height="${cH}" fill="transparent" data-tid="${tid}" style="cursor:default"/>`;
    s+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bW.toFixed(1)}" height="${bh.toFixed(1)}" fill="${fill}" rx="3" pointer-events="none"/>`;
    if(n<=16) s+=`<text x="${(bx+bW/2).toFixed(1)}" y="${H-pB+14}" text-anchor="middle" fill="#6A8AAE" font-size="9" pointer-events="none">${esc(lbl)}</text>`;
  });
  return s+`</svg>`;
}

function svgDonut(data, size=150){
  if(!data.length) return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px"><circle cx="${size/2}" cy="${size/2}" r="${size*0.35}" fill="none" stroke="#1C2E52" stroke-width="${size*0.12}"/></svg>`;
  const total=data.reduce((s,d)=>s+(d.val||0),0)||1;
  const cx=size/2,cy=size/2,R=size*0.38,ri=size*0.24;
  let angle=-Math.PI/2, s=`<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;overflow:visible">`;
  data.forEach(d=>{
    const sweep=(d.val/total)*Math.PI*2;
    if(sweep<0.001){angle+=sweep;return;}
    const a1=angle,a2=angle+sweep;
    const x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    const x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    const ix1=cx+ri*Math.cos(a1),iy1=cy+ri*Math.sin(a1);
    const ix2=cx+ri*Math.cos(a2),iy2=cy+ri*Math.sin(a2);
    const lg=sweep>Math.PI?1:0;
    const pctStr=(d.val/total*100).toFixed(1)+'%';
    const tid=regTip(d.name, [
      {val:$(d.val), color:d.color},
      {val:pctStr, color:'#6A8AAE', name:'del portafolio'}
    ]);
    s+=`<path d="M${ix1.toFixed(2)},${iy1.toFixed(2)} L${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${lg} 1 ${x2.toFixed(2)},${y2.toFixed(2)} L${ix2.toFixed(2)},${iy2.toFixed(2)} A${ri},${ri} 0 ${lg} 0 ${ix1.toFixed(2)},${iy1.toFixed(2)} Z"
      fill="${d.color}" stroke="#06091A" stroke-width="1.5" style="cursor:pointer;transition:opacity .15s"
      data-tid="${tid}"
      onmouseenter="this.style.opacity='.75'" onmouseleave="this.style.opacity='1'"/>`;
    angle=a2;
  });
  return s+'</svg>';
}

function svgArea(data, keys, colors, h=200){
  const W=560,H=h,pL=54,pB=28,pT=8,pR=8;
  const cW=W-pL-pR, cH=H-pB-pT, n=data.length;
  const allVals=data.flatMap(d=>keys.map(k=>d[k]||0));
  const maxV=Math.max(...allVals,1);
  const xP=i=>pL+(i/(n-1||1))*cW;
  const yP=v=>pT+cH-(v/maxV)*cH;
  const fmtY=v=>v>=1e6?`${(v/1e6).toFixed(1)}M`:v>=1000?`${Math.round(v/1000)}K`:`${Math.round(v)}`;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;overflow:visible"><defs>`;
  keys.forEach((k,i)=>{
    s+=`<linearGradient id="ag${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${colors[i]}" stop-opacity="0.35"/><stop offset="100%" stop-color="${colors[i]}" stop-opacity="0"/></linearGradient>`;
  });
  s+=`</defs>`;
  for(let i=0;i<=4;i++){
    const y=pT+cH*(1-i/4);
    s+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="#1C2E52" stroke-width="1"/>`;
    s+=`<text x="${pL-6}" y="${y+4}" text-anchor="end" fill="#6A8AAE" font-size="9">${fmtY(maxV*i/4)}</text>`;
  }
  if(n>1){
    keys.forEach((k,ki)=>{
      const pts=data.map((_,i)=>`${xP(i).toFixed(1)},${yP(data[i][k]||0).toFixed(1)}`);
      const area=`M${xP(0).toFixed(1)},${yP(0).toFixed(1)} L${pts.join(' L')} L${xP(n-1).toFixed(1)},${(pT+cH).toFixed(1)} L${xP(0).toFixed(1)},${(pT+cH).toFixed(1)} Z`;
      s+=`<path d="${area}" fill="url(#ag${ki})" pointer-events="none"/>`;
      s+=`<path d="M${pts.join(' L')}" fill="none" stroke="${colors[ki]}" stroke-width="2" pointer-events="none"/>`;
    });
    keys.forEach((k,ki)=>{
      data.forEach((d,i)=>{
        s+=`<circle cx="${xP(i).toFixed(1)}" cy="${yP(d[k]||0).toFixed(1)}" r="3" fill="${colors[ki]}" stroke="#06091A" stroke-width="1.5" pointer-events="none"/>`;
      });
    });
  }
  // invisible vertical hover bands — one per data point
  const bandW=n>1?cW/(n-1):cW;
  data.forEach((d,i)=>{
    const cx=xP(i);
    const bx=i===0?pL:cx-bandW/2;
    const bw=i===0||i===n-1?bandW/2:bandW;
    const lbl=String(d.año||d.lbl||'');
    const nameMap={capital:'Capital',acumulado:'Divs Acumulados',dividendo:'Dividendo Anual'};
    const rows=keys.map((k,ki)=>({val:$(d[k]||0), color:colors[ki], name:nameMap[k]||k}));
    const tid=regTip(lbl, rows);
    s+=`<rect x="${Math.max(pL,bx).toFixed(1)}" y="${pT}" width="${Math.max(8,bw).toFixed(1)}" height="${cH}" fill="transparent" data-tid="${tid}" style="cursor:default"/>`;
  });
  const step=Math.max(1,Math.floor(n/8));
  data.forEach((d,i)=>{ if(i%step===0||i===n-1) s+=`<text x="${xP(i).toFixed(1)}" y="${H-pB+14}" text-anchor="middle" fill="#6A8AAE" font-size="8" pointer-events="none">${esc(String(d.año||d.lbl||''))}</text>`; });
  return s+'</svg>';
}

  // annual — total dividends per year
  const yrMap={};
  DIVS.forEach(d=>{ yrMap[d.yr]=(yrMap[d.yr]||0)+d.amt; });
  const allAnnual=Object.entries(yrMap).sort(([a],[b])=>+a-+b)
    .map(([yr,v])=>({lbl:String(yr),amt:Math.round(v)}));

  // ventana deslizable de 10 años
  const WINDOW=10;
  const totalYrs=allAnnual.length;
  // offset: cuántos años desplazamos desde el inicio (persiste en window)
  if(window._chartOffset===undefined||window._chartOffset>Math.max(0,totalYrs-WINDOW)){
    window._chartOffset=Math.max(0,totalYrs-WINDOW); // por defecto: mostrar los más recientes
  }
  const offset=window._chartOffset;
  const visData=allAnnual.slice(offset, offset+WINDOW);
  const canLeft=offset>0;
  const canRight=offset+WINDOW<totalYrs;
  const rangeStart=visData[0]?.lbl||'';
  const rangeEnd=visData[visData.length-1]?.lbl||'';

  // by stock
  const sMap={};
  DIVS.forEach(d=>{ sMap[d.nemo]=(sMap[d.nemo]||0)+d.amt; });
  const byStock=Object.entries(sMap).sort(([,a],[,b])=>b-a)
    .map(([nemo,amt],i)=>({nemo,amt:Math.round(amt),color:clr[i%clr.length]}));

  // pie — ordenado de mayor a menor

    .sort((a,b)=>b.val-a.val)

        ${availYears.map(y=>`<option value="${y}">${y}</option>`).join('')}
        ${availYears.length===0?`<option value="${new Date().getFullYear()}">${new Date().getFullYear()}</option>`:''}
      </select>
      <button class="btn btn-primary" style="font-size:12px;padding:7px 14px;display:flex;align-items:center;gap:6px" onclick="downloadReport()">
        <span>📄</span> Generar Informe PDF
      </button>
    </div>
  </div>
  <div class="stat-grid">
    <div class="stat-card" style="border-top-color:var(--gold);cursor:pointer" onclick="editTotalInvertido()" title="Haz clic para editar el total invertido">
      <div class="stat-lbl">Total Invertido <span style="color:var(--dim);font-size:8px">✏️ editar</span></div>

    </div>
    <div class="stat-card" style="border-top-color:var(--green)"><div class="stat-lbl">Dividendos Totales</div><div class="stat-val" style="color:var(--green)">${$(totD)}</div><div class="stat-sub">Desde el inicio de tus inversiones</div></div>

function renderPortfolio(){

  let rows='';
  PORT.forEach((p,i)=>{
    const inv=p.qty*p.bp, cur=p.qty*p.cp;
    const d2=dMap[p.nemo]||0;
    const yoc=inv>0?d2/inv*100:0;
    const gVal=cur-inv, gP=inv>0?gVal/inv*100:0;
    const gCol=gVal>=0?'var(--green)':'var(--red)';
    const gAr=gP>=0?'▲':'▼';
    rows+=`<tr class="${p.qty>0?'':'dimmed'}">
      <td><div style="display:flex;align-items:center;gap:7px"><div style="width:8px;height:8px;border-radius:2px;background:${clr[i%clr.length]};flex-shrink:0"></div><span style="font-family:var(--mono);font-weight:700">${esc(p.nemo)}</span></div></td>

      <td style="font-family:var(--mono)">${fmt(p.qty)}</td>
      <td style="font-family:var(--mono);color:var(--muted)">${$(p.bp,2)}</td>
      <td style="font-family:var(--mono)">${$(p.cp,2)}</td>
      <td style="font-family:var(--mono);color:var(--muted)">${$(inv)}</td>
      <td style="font-family:var(--mono)">${$(cur)}</td>
      <td style="font-family:var(--mono)"><span style="color:${gCol};font-weight:700">${$(Math.abs(gVal))}</span> <span style="color:${gCol};font-size:10px">${gAr}${Math.abs(gP).toFixed(1)}%</span></td>
      <td style="font-family:var(--mono);color:var(--gold);font-weight:700;font-size:13px">${inv>0?pct(yoc):'—'}</td>

        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

}

function portModalHtml(p=null){

  const portId=p?p.id:'';
  const saveFn=portId?`savePortfolioById('${portId}')`:'savePortfolio()';
  const nemo=p?p.nemo:'', ind=p?p.ind:INDS[0], qty=p?p.qty:'', bp=p?p.bp:'', cp=p?p.cp:'';
  const infoBar=!isNew?`<div class="info-bar">Puedes modificar cualquier campo. Los cambios se guardan automáticamente.</div>`:'';
  const indsOpts=INDS.map(x=>`<option value="${x}"${x===ind?' selected':''}>${x}</option>`).join('');
  return `
  ${infoBar}
  <div class="field"><label>Nemotécnico (nombre de la acción)</label><input id="f-nemo" value="${esc(nemo)}" placeholder="Ej: CHILE, LTM, BSANTANDER"/></div>
  <div class="field"><label>Industria / Sector</label><select id="f-ind">${indsOpts}</select></div>
  <div class="two-fields">
    <div class="field"><label>N° de Acciones que posees</label><input id="f-qty" type="number" value="${qty}" placeholder="0"/></div>
    <div class="field"><label>Precio de Compra Promedio (CLP)</label><input id="f-bp" type="number" value="${bp}" placeholder="0"/></div>
  </div>
  <div class="field"><label>Precio Actual de la Acción (CLP)</label><input id="f-cp" type="number" value="${cp}" placeholder="0"/></div>
  <div class="hint">💡 Actualiza el <b style="color:var(--text)">Precio Actual</b> cada vez que quieras ver tu ganancia de capital al día.</div>
  <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:6px">
    <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="${saveFn}">${isNew?'Agregar al Portafolio':'Guardar Cambios'}</button>
  </div>`;
}

function savePortfolio(id){
  const nemo=(el('f-nemo').value||'').toUpperCase().trim();
  if(!nemo){ alert('El nemotécnico no puede estar vacío.'); return; }
  const entry={id:id||uid(),nemo,ind:el('f-ind').value,qty:parseFloat(el('f-qty').value)||0,bp:parseFloat(el('f-bp').value)||0,cp:parseFloat(el('f-cp').value)||0};
  if(id){
    const old=PORT.find(x=>x.id===id);
    if(old && old.nemo !== nemo){
      DIVS=DIVS.map(d=>d.nemo===old.nemo ? {...d, nemo} : d);
    }
    PORT=PORT.map(x=>x.id===id?entry:x);
  } else {
    PORT=[...PORT,entry];
  }
  save(); closeModal(); render();
}
function delPortfolio(id){
  if(confirm('¿Eliminar este instrumento del portafolio?')){ PORT=PORT.filter(x=>x.id!==id); save(); render(); }
}

// ── DIVIDENDS ────────────────────────────────────────────────────────────────
function renderDividends(){
  const years=[...new Set([...DIVS,...COMMS].map(x=>x.yr))].sort();
  const cy=new Date().getFullYear();
  if(!years.includes(cy)) years.push(cy);
  if(!years.includes(CUR_YR)) CUR_YR=years[years.length-1];

  const fDivs=DIVS.filter(d=>d.yr===CUR_YR).sort((a,b)=>a.mo-b.mo||a.nemo.localeCompare(b.nemo));
  const fComms=COMMS.filter(c=>c.yr===CUR_YR).sort((a,b)=>a.mo-b.mo);
  const totD=fDivs.reduce((s,d)=>s+d.amt,0);
  const totC=fComms.reduce((s,c)=>s+c.amt,0);
  const nemos=[...new Set(PORT.map(p=>p.nemo))].sort();

  const mMap={};fDivs.forEach(d=>{mMap[d.mo]=(mMap[d.mo]||0)+d.amt;});
  const chartData=MOS.map((l,i)=>({lbl:l,amt:Math.round(mMap[i+1]||0)}));

  const yrBtns=years.map(y=>`<button class="yr-btn${y===CUR_YR?' active':''}" onclick="switchYear(${y})">${y}</button>`).join('');

  // dividends table
  let divRows='';
  if(fDivs.length===0){
    divRows=`<tr><td colspan="4"><div class="empty">Sin dividendos para ${CUR_YR}.<br><button class="btn btn-primary" style="margin-top:12px" onclick="newDiv()">+ Registrar primer dividendo</button></div></td></tr>`;
  } else {
    fDivs.forEach(d=>{
      const ci=Math.max(0,nemos.indexOf(d.nemo))%clr.length;
      divRows+=`<tr>
        <td style="font-family:var(--mono);color:var(--muted)">${MOF[d.mo-1]}</td>
        <td><span class="tag" style="background:${clr[ci]}22;color:${clr[ci]};border-color:${clr[ci]}33">${esc(d.nemo)}</span></td>
        <td style="font-family:var(--mono);font-weight:700;color:var(--green);font-size:13px">${$(d.amt,2)}</td>
        <td><div style="display:flex;gap:4px">
          <button class="act-btn btn-sm" onclick="editDiv('${d.id}')">✏️</button>
          <button class="del-btn btn-sm" onclick="delDiv('${d.id}')">🗑️</button>
        </div></td>
      </tr>`;
    });
  }

  // comms table
  let commRows='';
  if(fComms.length===0){
    commRows=`<tr><td colspan="4"><div class="empty">Sin comisiones para ${CUR_YR}.<br><button class="btn btn-primary" style="margin-top:12px" onclick="newComm()">+ Registrar comisión</button></div></td></tr>`;
  } else {
    fComms.forEach(c=>{
      const mDiv=fDivs.filter(d=>d.mo===c.mo).reduce((s,d)=>s+d.amt,0);
      const cp=mDiv>0?c.amt/mDiv*100:null;
      const cpCol=cp!=null?(cp>20?'var(--red)':cp>10?'var(--gold)':'var(--green)'):'var(--muted)';
      commRows+=`<tr>
        <td style="font-family:var(--mono);color:var(--muted)">${MOF[c.mo-1]}</td>
        <td style="font-family:var(--mono);font-weight:700;color:var(--red);font-size:13px">${$(c.amt,2)}</td>
        <td style="font-family:var(--mono);font-size:11px"><span style="color:${cpCol}">${cp!=null?pct(cp):'—'}</span></td>
        <td><div style="display:flex;gap:4px">
          <button class="act-btn btn-sm" onclick="editComm('${c.id}')">✏️</button>
          <button class="del-btn btn-sm" onclick="delComm('${c.id}')">🗑️</button>
        </div></td>
      </tr>`;
    });
  }

  el('page-dividends').innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:9px">
    <span style="font-size:18px;font-weight:700">Dividendos &amp; Comisiones</span>
    <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
      <div class="yr-bar">${yrBtns}</div>
      <button class="btn btn-primary" onclick="newDiv()">+ Dividendo</button>
      <button class="btn btn-ghost" onclick="newComm()">+ Comisión</button>
    </div>
  </div>
  <div class="mini-grid">
    <div class="mini-card" style="border-top-color:var(--green)"><div class="mini-lbl">Dividendos ${CUR_YR}</div><div class="mini-val" style="color:var(--green)">${$(Math.round(totD))}</div></div>
    <div class="mini-card" style="border-top-color:var(--red)"><div class="mini-lbl">Comisiones ${CUR_YR}</div><div class="mini-val" style="color:var(--red)">${$(Math.round(totC))}</div></div>
    <div class="mini-card" style="border-top-color:var(--gold)"><div class="mini-lbl">Dividendo Neto</div><div class="mini-val" style="color:var(--gold)">${$(Math.round(totD-totC))}</div></div>
  </div>
  <div class="panel"><div class="panel-title">Flujo Mensual — ${CUR_YR}</div>${svgBarChart(chartData,'lbl','amt','#E8B84B',155)}</div>
  <div class="tab-bar">
    <button class="${CUR_DIVTAB==='divs'?'active':''}" onclick="switchDivTab('divs')">📋 Dividendos</button>
    <button class="${CUR_DIVTAB==='comms'?'active':''}" onclick="switchDivTab('comms')">💸 Comisiones de Custodia</button>
  </div>
  <div class="tab-content">
    ${CUR_DIVTAB==='divs'?`
      <div class="tbl-wrap"><table>
        <thead><tr><th>Mes</th><th>Instrumento</th><th>Monto Recibido</th><th></th></tr></thead>
        <tbody>${divRows}</tbody>
      </table></div>
    `:`
      <div style="padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:flex-end">
        <button class="btn btn-primary btn-sm" onclick="newComm()">+ Registrar Comisión</button>
      </div>
      <table>
        <thead><tr><th>Mes</th><th>Monto Comisión</th><th>% del Dividendo del Mes</th><th></th></tr></thead>
        <tbody>${commRows}</tbody>
      </table>
    `}
  </div>`;
}

function switchYear(y){ CUR_YR=y; renderDividends(); }
function switchDivTab(t){ CUR_DIVTAB=t; renderDividends(); }

function divModalHtml(d=null){
  const nemos=[...new Set(PORT.map(p=>p.nemo))].sort();
  const curNemo=d?d.nemo:(nemos[0]||'');
  const divId=d?d.id:'';
  const moSel=MOF.map((m,i)=>`<option value="${i+1}"${d&&d.mo===i+1?' selected':(!d&&new Date().getMonth()===i?' selected':'')}>${m}</option>`).join('');
  const saveFn=divId?`saveDivById('${divId}')`:'saveDiv()';
  const nemoField=nemos.length>0
    ?`<select id="f-nemo" style="width:100%;background:var(--el);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-size:14px;outline:none;font-family:inherit" onchange="toggleNuevoNemo(this)">
        ${nemos.map(n=>`<option value="${esc(n)}"${n===curNemo?' selected':''}>${esc(n)}</option>`).join('')}
        <option value="__nuevo__">&#x2795; Agregar nuevo instrumento...</option>
      </select>
      <div id="nuevo-nemo-wrap" style="display:none;margin-top:7px">
        <input id="f-nemo-nuevo" placeholder="Nombre del nuevo instrumento (ej: ENELAM)" style="width:100%;background:var(--el);border:1px solid var(--gold);border-radius:9px;padding:9px 12px;color:var(--text);font-size:14px;outline:none;font-family:inherit"/>
        <div style="color:var(--muted);font-size:10px;margin-top:4px">Se agregara automaticamente al Portafolio para que completes sus datos despues.</div>
      </div>`
    :`<input id="f-nemo" value="${esc(curNemo)}" placeholder="Ej: CHILE" style="width:100%;background:var(--el);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-size:14px;outline:none;font-family:inherit"/>`;
  return `
  <div class="field"><label>Instrumento</label>${nemoField}</div>
  <div class="two-fields">
    <div class="field"><label>Mes</label><select id="f-mo">${moSel}</select></div>
    <div class="field"><label>Año</label><input id="f-yr" type="number" value="${d?d.yr:CUR_YR}"/></div>
  </div>
  <div class="field"><label>Monto Recibido (CLP)</label><input id="f-amt" type="number" value="${d?d.amt:''}" placeholder="0"/></div>
  <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:6px">
    <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="${saveFn}">Guardar Dividendo</button>
  </div>`;
}

function toggleNuevoNemo(sel){
  const wrap=document.getElementById('nuevo-nemo-wrap');
  if(!wrap) return;
  if(sel.value==='__nuevo__'){
    wrap.style.display='block';
    const inp=document.getElementById('f-nemo-nuevo');
    if(inp) inp.focus();
  } else {
    wrap.style.display='none';
  }
}

function commModalHtml(c=null){
  const commId=c?c.id:'';
  const saveFn=commId?`saveCommById('${commId}')`:'saveComm()';
  const moSel=MOF.map((m,i)=>`<option value="${i+1}"${c&&c.mo===i+1?' selected':(!c&&new Date().getMonth()===i?' selected':'')}>${m}</option>`).join('');
  return `<div class="field"><label>Mes</label><select id="f-mo">${moSel}</select></div>
  <div class="field"><label>Monto Comisión (CLP)</label><input id="f-amt" type="number" value="${c?c.amt:''}" placeholder="0"/></div>
  <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:6px">
    <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="${saveFn}">Guardar Comisión</button>
  </div>`;
}

function newDiv(){ openModal('Registrar Dividendo', divModalHtml(null), 480); }
function editDiv(id){ const d=DIVS.find(x=>x.id===id); if(d) openModal('Editar Dividendo', divModalHtml(d), 480); }
function saveDivById(id){ saveDiv(id); }  // alias usado por el modal de edición
function saveDiv(id){
  const selEl=el('f-nemo');
  let nemo='';
  if(selEl.tagName==='SELECT'&&selEl.value==='__nuevo__'){
    nemo=(el('f-nemo-nuevo')?.value||'').toUpperCase().trim();
    if(!nemo){alert('Escribe el nombre del nuevo instrumento.');return;}
    // Agregar al portafolio si no existe
    if(!PORT.find(p=>p.nemo===nemo)){
      PORT=[...PORT,{id:uid(),nemo,ind:'Otro',qty:0,bp:0,cp:0}];
    }
  } else {
    nemo=(selEl.value||'').trim();
  }
  const amt=parseFloat(el('f-amt').value)||0;
  if(!nemo||!amt){alert('Completa instrumento y monto.');return;}
  const entry={id:id||uid(),nemo,yr:parseInt(el('f-yr').value)||CUR_YR,mo:parseInt(el('f-mo').value),amt};
  if(id) DIVS=DIVS.map(x=>x.id===id?entry:x); else DIVS=[...DIVS,entry];
  save(); closeModal(); render();
}
function delDiv(id){ if(confirm('¿Eliminar este dividendo?')){ DIVS=DIVS.filter(x=>x.id!==id); save(); render(); } }

function newComm(){ openModal('Registrar Comisión de Custodia', commModalHtml(null), 420); }
function editComm(id){ const c=COMMS.find(x=>x.id===id); if(c) openModal('Editar Comisión', commModalHtml(c), 420); }
function saveCommById(id){ saveComm(id); }
function saveComm(id){
  const mo=parseInt(el('f-mo').value), amt=parseFloat(el('f-amt').value)||0;
  if(!amt){ alert('Ingresa el monto de la comisión.'); return; }
  // if editing, remove any duplicate for same month (excluding current record)
  if(id){
    COMMS=COMMS.map(x=>x.id===id?{...x,mo,amt}:x);
  } else {
    const ex=COMMS.find(c=>c.yr===CUR_YR&&c.mo===mo);
    if(ex){ if(!confirm('Ya hay una comisión para ese mes. ¿Reemplazar?')) return; COMMS=COMMS.filter(c=>c.id!==ex.id); }
    COMMS=[...COMMS,{id:uid(),yr:CUR_YR,mo,amt}];
  }
  save(); closeModal(); render();
}
function delComm(id){ if(confirm('¿Eliminar esta comisión?')){ COMMS=COMMS.filter(x=>x.id!==id); save(); render(); } }

// ── PROJECTION ───────────────────────────────────────────────────────────────
function calcProj(){
  const rows=[]; let cap=PROJ.init, cumD=0, effRate=PROJ.rate;
  for(let y=0;y<=PROJ.yrs;y++){
    const anual=cap*(effRate/100);
    rows.push({año:y===0?'Inicio':`Año ${y}`,capital:Math.round(cap),dividendo:Math.round(anual),acumulado:Math.round(cumD)});
    cumD+=anual; if(PROJ.reinv) cap+=anual; effRate=Math.min(effRate+PROJ.growth*0.01,99);
  }
  return rows;
}

function renderProjection(){
  const totalInv=PORT.reduce((s,p)=>s+p.qty*p.bp,0);
  const totD=DIVS.reduce((s,d)=>s+d.amt,0);
  if(PROJ.init===0) PROJ.init=Math.round(totalInv)||2610000;
  if(PROJ.rate===5&&totalInv>0) PROJ.rate=Math.round(totD/totalInv*1000)/10||5;

  const data=calcProj();
  const final=data[data.length-1];
  const mult=PROJ.init>0?(final.capital+final.acumulado)/PROJ.init:1;
  const barData=data.slice(1).map(d=>({lbl:d.año.replace('Año ',''),amt:d.dividendo}));

  const chkCol=PROJ.reinv?'var(--gold)':'var(--border)';
  const chkBg=PROJ.reinv?'var(--gold)':'transparent';
  const lblCol=PROJ.reinv?'var(--gold)':'var(--muted)';

  el('page-projection').innerHTML=`
  <div style="font-size:18px;font-weight:700;margin-bottom:16px">Proyección de Crecimiento</div>
  <div class="proj-wrap">
    <div class="proj-params">
      <div class="proj-title">Parámetros</div>
      <div class="field"><label>Capital Inicial (CLP)</label><input id="pr-init" type="number" value="${PROJ.init}" onchange="updateProj()" onblur="updateProj()"/></div>
      <div class="field"><label>Tasa Dividendo Anual: <b id="lbl-rate">${PROJ.rate}%</b></label>
        <input type="range" id="pr-rate" min="0.5" max="30" step="0.5" value="${PROJ.rate}" oninput="updateProj()" style="accent-color:var(--gold)"/>
        <div class="range-row"><span>0.5%</span><span>30%</span></div>
      </div>
      <div class="field"><label>Crecimiento del Dividendo: <b id="lbl-growth">${PROJ.growth}%</b> anual</label>
        <input type="range" id="pr-growth" min="0" max="15" step="0.5" value="${PROJ.growth}" oninput="updateProj()" style="accent-color:var(--blue)"/>
        <div class="range-row"><span>0%</span><span>15%</span></div>
      </div>
      <div class="field"><label>Horizonte: <b id="lbl-yrs">${PROJ.yrs} años</b></label>
        <input type="range" id="pr-yrs" min="1" max="40" value="${PROJ.yrs}" oninput="updateProj()" style="accent-color:var(--green)"/>
        <div class="range-row"><span>1</span><span>40</span></div>
      </div>
      <div class="checkbox-row" id="reinv-row" style="border-color:${chkCol}" onclick="toggleReinv()">
        <div class="checkbox-box" id="chk-box" style="border-color:${chkCol};background:${chkBg}">${PROJ.reinv?'✓':''}</div>
        <span class="checkbox-lbl" id="chk-lbl" style="color:${lblCol}">Reinvertir dividendos</span>
      </div>
      <div class="proj-summary">
        <div style="color:var(--muted);font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px" id="proj-sum-title">En ${PROJ.yrs} años</div>
        <div class="proj-sum-grid" id="proj-sum-grid">
          <div><div class="proj-sum-lbl">Divs Anuales</div><div class="proj-sum-val" style="color:var(--gold)">${$(Math.round(final.dividendo))}</div></div>
          <div><div class="proj-sum-lbl">Divs Acumulados</div><div class="proj-sum-val" style="color:var(--green)">${$(Math.round(final.acumulado))}</div></div>
          <div><div class="proj-sum-lbl">Capital Final</div><div class="proj-sum-val" style="color:var(--blue)">${$(Math.round(final.capital))}</div></div>
          <div><div class="proj-sum-lbl">Multiplicador</div><div class="proj-sum-val">${mult.toFixed(1)}x</div></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div style="font-size:13px;font-weight:700;margin-bottom:4px">Evolución del Patrimonio Dividendero</div>
      <div style="color:var(--muted);font-size:11px;margin-bottom:12px">Capital${PROJ.reinv?' con reinversión':''} + dividendos acumulados</div>
      <div id="proj-area-chart">${svgArea(data,['capital','acumulado'],['#3B82F6','#E8B84B'],200)}</div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>Capital</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--gold)"></div>Divs Acumulados</div>
      </div>
      <div style="font-size:12px;font-weight:700;margin-bottom:9px">Dividendo Anual Esperado</div>
      <div id="proj-bar-chart">${svgBarChart(barData,'lbl','amt','#E8B84B',130)}</div>
    </div>
  </div>`;
}

function updateProj(){
  // Leer valores actuales (los inputs siguen en el DOM)
  const initEl=el('pr-init'), rateEl=el('pr-rate'), growthEl=el('pr-growth'), yrsEl=el('pr-yrs');
  if(!initEl) return; // panel no renderizado todavía
  PROJ.init  = parseFloat(initEl.value)||0;
  PROJ.rate  = parseFloat(rateEl.value)||1;
  PROJ.growth= parseFloat(growthEl.value)||0;
  PROJ.yrs   = parseInt(yrsEl.value)||10;

  const data  = calcProj();
  const final = data[data.length-1];
  const mult  = PROJ.init>0?(final.capital+final.acumulado)/PROJ.init:1;
  const barData = data.slice(1).map(d=>({lbl:d.año.replace('Año ',''),amt:d.dividendo}));

  // Actualizar solo labels
  const lblRate=el('lbl-rate'), lblGrowth=el('lbl-growth'), lblYrs=el('lbl-yrs');
  if(lblRate)   lblRate.textContent   = PROJ.rate+'%';
  if(lblGrowth) lblGrowth.textContent = PROJ.growth+'%';
  if(lblYrs)    lblYrs.textContent    = PROJ.yrs+' años';

  // Actualizar resumen
  const sg=el('proj-sum-grid');
  if(sg) sg.innerHTML=`
    <div><div class="proj-sum-lbl">Divs Anuales</div><div class="proj-sum-val" style="color:var(--gold)">${$(Math.round(final.dividendo))}</div></div>
    <div><div class="proj-sum-lbl">Divs Acumulados</div><div class="proj-sum-val" style="color:var(--green)">${$(Math.round(final.acumulado))}</div></div>
    <div><div class="proj-sum-lbl">Capital Final</div><div class="proj-sum-val" style="color:var(--blue)">${$(Math.round(final.capital))}</div></div>
    <div><div class="proj-sum-lbl">Multiplicador</div><div class="proj-sum-val">${mult.toFixed(1)}x</div></div>`;
  // update "En X años" label
  const sumTitle=el('proj-sum-title');
  if(sumTitle) sumTitle.textContent=`En ${PROJ.yrs} años`;

  // Actualizar gráficos sin tocar los inputs
  const areaWrap=el('proj-area-chart');
  const barWrap =el('proj-bar-chart');
  if(areaWrap) areaWrap.innerHTML=svgArea(data,['capital','acumulado'],['#3B82F6','#E8B84B'],200);
  if(barWrap)  barWrap.innerHTML=svgBarChart(barData,'lbl','amt','#E8B84B',130);
}

          <input type="number" value="${p.bp}" onchange="updatePortField('${p.id}','bp',this.value)" style="width:100%;background:var(--el);border:1px solid var(--border);border-radius:7px;padding:6px 9px;color:var(--text);font-size:12px;outline:none;font-family:inherit"/></div>

  openModal('✏️ Editar Total Invertido',`
    <div style="background:var(--el);border-radius:9px;padding:9px 13px;margin-bottom:14px;color:var(--muted);font-size:11px;border-left:3px solid var(--gold)">
      Modifica las acciones o precio de compra de cada instrumento. El total se recalcula automáticamente.

    ${rows}
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
      <span style="color:var(--muted);font-size:11px">Total: <b id="inv-total-preview" style="color:var(--gold);font-family:var(--mono)">${$(totalInv)}</b></span>

// ── GRÁFICO COMPARATIVO ENTRE AÑOS ───────────────────────────────────────────
function svgGroupedBar(yearlyData, years, h=220){
  // yearlyData: { yr: [12 valores mensuales] }
  // years: array de años ordenados
  const W=580, H=h, pL=54, pB=36, pT=12, pR=8;
  const cW=W-pL-pR, cH=H-pB-pT;
  const n=12; // meses
  const nY=years.length;
  const gap=cW/n;
  const bW=Math.min(22, (gap*0.85)/nY);
  const grpW=bW*nY;
  const YRclr=['#E8B84B','#10B981','#3B82F6','#A855F7','#F97316','#06B6D4'];

  // max value
  let maxV=1;
  years.forEach(yr=>{ yearlyData[yr].forEach(v=>{ if(v>maxV) maxV=v; }); });

  const fmtY=v=>v>=1e6?`${(v/1e6).toFixed(1)}M`:v>=1000?`${Math.round(v/1000)}K`:`${Math.round(v)}`;

  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;overflow:visible">`;

  // grid lines
  for(let i=0;i<=4;i++){
    const y=pT+cH*(1-i/4);
    s+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="#1C2E52" stroke-width="1"/>`;
    s+=`<text x="${pL-6}" y="${y+4}" text-anchor="end" fill="#6A8AAE" font-size="9" font-family="var(--mono)">${fmtY(maxV*i/4)}</text>`;
  }

  // bars
  MOS.forEach((mes,mi)=>{
    const grpX = pL + gap*mi + (gap-grpW)/2;
    years.forEach((yr,yi)=>{
      const v = yearlyData[yr][mi]||0;
      const bh = Math.max(v>0?2:0, (v/maxV)*cH);
      const bx = grpX + yi*bW;
      const by = pT+cH-bh;
      const col = YRclr[yi%YRclr.length];
      const tid = regTip(`${mes} ${yr}`, [{val:$(Math.round(v)), color:col, name:`Año ${yr}`}]);
      s+=`<rect x="${bx.toFixed(1)}" y="${pT}" width="${bW.toFixed(1)}" height="${cH}" fill="transparent" data-tid="${tid}" style="cursor:default"/>`;
      s+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${(bW-1).toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}" rx="2" opacity="${v>0?1:0}" pointer-events="none"/>`;
    });
    // etiqueta mes
    s+=`<text x="${(pL+gap*mi+gap/2).toFixed(1)}" y="${H-pB+14}" text-anchor="middle" fill="#6A8AAE" font-size="9" font-family="var(--mono)" pointer-events="none">${mes}</text>`;
  });

  s+=`</svg>`;
  return s;
}

function buildCalendarData(yr){
  const instMeses = {};
  const now = new Date();
  const curYr = now.getFullYear();
  const curMo = now.getMonth() + 1;

  function calcEstimados(pagos){
    const mesesSet = new Set(pagos.map(d=>d.mo));
    const estimados = {};
    mesesSet.forEach(mo=>{
      // Último pago conocido para ese mes (el más reciente por año)
      const pagosDelMes = pagos.filter(d=>d.mo===mo).sort((a,b)=>b.yr-a.yr);
      estimados[mo] = pagosDelMes.length ? pagosDelMes[0].amt : 0;
    });
    return { mesesSet, estimados };
  }

  PORT.forEach((p,pi)=>{
    const pagos = DIVS.filter(d=>d.nemo===p.nemo);
    if(!pagos.length) return;
    const { mesesSet, estimados } = calcEstimados(pagos);
    instMeses[p.nemo]={color:clr[pi%clr.length],meses:[...mesesSet].sort((a,b)=>a-b),estimados};
  });

  const portNemos = new Set(PORT.map(p=>p.nemo));
  DIVS.forEach(d=>{
    if(portNemos.has(d.nemo)||instMeses[d.nemo]) return;
    const pagos=DIVS.filter(x=>x.nemo===d.nemo);
    const { mesesSet, estimados } = calcEstimados(pagos);
    const idx=Object.keys(instMeses).length;
    instMeses[d.nemo]={color:clr[idx%clr.length],meses:[...mesesSet].sort((a,b)=>a-b),estimados};
  });

  const meses=MOS.map((_,i)=>{
    const mo=i+1;

    // ¿Es este mes un período futuro?
    // Pasado: año < actual, o mismo año pero mes ya pasó
    // Futuro: año > actual, o mismo año pero mes aún no llega
    const isFuturePeriod = yr > curYr || (yr === curYr && mo > curMo);
    const isPastPeriod   = yr < curYr || (yr === curYr && mo < curMo);

    const reales = DIVS.filter(d=>d.yr===yr&&d.mo===mo);
    const totalReal = reales.reduce((s,d)=>s+d.amt,0);

    // Solo calcular esperados si es un período futuro (sin datos reales aún)
    let esperados = [];
    if(isFuturePeriod){
      esperados = Object.entries(instMeses)
        .filter(([,d])=>d.meses.includes(mo))
        .map(([nemo,d])=>({nemo,color:d.color,estimado:Math.round(d.estimados[mo]||0)}))
        .sort((a,b)=>b.estimado-a.estimado);
    } else if(reales.length===0 && !isPastPeriod){
      // mes actual sin pagos aún — mostrar estimado
      esperados = Object.entries(instMeses)
        .filter(([,d])=>d.meses.includes(mo))
        .map(([nemo,d])=>({nemo,color:d.color,estimado:Math.round(d.estimados[mo]||0)}))
        .sort((a,b)=>b.estimado-a.estimado);
    }

    const totalEst = esperados.reduce((s,d)=>s+d.estimado,0);
    return{mo,lbl:MOS[i],esperados,reales,totalReal:Math.round(totalReal),totalEst:Math.round(totalEst),isFuturePeriod,isPastPeriod};
  });
  return{meses,instMeses};
}

function renderCalendar(){
  const now=new Date();
  const curMo=now.getMonth()+1;
  const years=[...new Set(DIVS.map(d=>d.yr))].sort((a,b)=>b-a);
  const cy=now.getFullYear();
  if(!years.includes(cy)) years.unshift(cy);

  const selYrEl=el('cal-yr-sel');
  const selYr=selYrEl?parseInt(selYrEl.value):cy;
  const isCurrentYr=selYr===cy;

  const{meses,instMeses}=buildCalendarData(selYr);
  const maxTotal=Math.max(...meses.map(m=>Math.max(m.totalReal,m.totalEst)),1);

  const proxMes=isCurrentYr?meses.find(m=>m.mo>=curMo&&m.esperados.length>0):null;
  const totalRealAnual=meses.reduce((s,m)=>s+m.totalReal,0);
  const totalEstAnual=meses.reduce((s,m)=>s+m.totalEst,0);
  const mesesConPago=meses.filter(m=>m.esperados.length>0||m.reales.length>0).length;
  const isPastYear = selYr < new Date().getFullYear();

  const yrOpts=years.map(y=>`<option value="${y}"${y===selYr?' selected':''}>${y}</option>`).join('');

    ).join('');

    let content='';
    if(hasReal){

    } else if(showEst){

    } else if(isPastYear || isPast){
      content=`<div class="cal-none">Sin dividendos</div>`;
    } else {

    }

    </div>`;

    ?detData.esperados.map(e=>{

        return `<div class="cal-inst-row">

            ${realAmt>0
              ?`<span style="font-family:var(--mono);font-size:12px;color:var(--green);font-weight:700">✓ ${$(Math.round(realAmt))}</span>`

      }).join('')
    :`<div style="padding:16px 0;text-align:center;color:var(--dim);font-size:12px;font-family:var(--mono)">No hay pagos esperados este mes</div>`;

  el('page-calendar').innerHTML=`

    <select id="cal-yr-sel" onchange="renderCalendar()"
      style="background:var(--el);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);font-size:13px;font-family:var(--mono);outline:none;cursor:pointer">
      ${yrOpts}
    </select>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:16px">

      <div class="mini-val" style="color:var(--blue)">${mesesConPago} / 12</div>
    </div>
  </div>

  ${proxMes?`<div style="background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);border-radius:10px;padding:10px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px">
    <span style="font-size:18px">📬</span>

      <div style="font-family:var(--mono);font-size:10px;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:.08em">Próximo pago esperado</div>
      <div style="font-family:var(--mono);font-size:13px;color:var(--text);font-weight:700;margin-top:2px">${MOF[proxMes.mo-1]} · ${proxMes.esperados.map(e=>e.nemo).join(', ')} · Est. ${$(proxMes.totalEst)}</div>

  <div class="cal-detail">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-family:var(--mono);font-weight:700;font-size:13px;color:var(--gold)">${MOF[detMo-1]} ${selYr}</div>
      <div style="display:flex;gap:7px">

    ${detData.totalEst>0&&!detHasReal&&detData.isFuturePeriod?`<span style="font-family:var(--mono);font-size:10px;color:var(--gold);background:rgba(232,184,75,.1);border:1px solid rgba(232,184,75,.25);border-radius:5px;padding:2px 7px">Estimado</span>`:''}
      </div>
    </div>
    ${detRows}
    ${detData.totalEst>0||detHasReal?`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)20">
      <span style="font-family:var(--mono);font-size:10px;color:var(--muted)">Total del mes</span>
      <span style="font-family:var(--mono);font-size:14px;font-weight:700;color:${detHasReal?'var(--green)':'var(--gold)'}">${detHasReal?$(detData.totalReal):$(detData.totalEst)}</span>

  </div>

  <div style="padding:10px 14px;background:var(--el);border-radius:9px;border:1px solid var(--border)">
    <span style="font-size:11px;color:var(--muted)">
      💡 Haz clic en cualquier mes para ver el detalle. <span style="color:var(--green)">Verde = pago confirmado</span> · <span style="color:var(--gold)">Dorado = estimado basado en historial</span>
    </span>

  const byNemoArr = Object.entries(byNemo).sort(([,a],[,b])=>b-a);
  const byMes = {};
  fDivs.forEach(d=>{ byMes[d.mo]=(byMes[d.mo]||0)+d.amt; });

  const today   = new Date();
  const fechaStr= today.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});

  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  const PW=210, PH=297, ML=18, MR=18, CW=PW-ML-MR;

  // ── PALETA ──
  const DARK  =[6,9,26];
  const GOLD  =[232,184,75];
  const GREEN =[16,185,129];
  const RED   =[239,68,68];
  const BLUE  =[59,130,246];
  const GRAY  =[248,249,252];
  const LGRAY =[232,236,242];
  const MGRAY =[106,138,174];
  const TEXT  =[26,32,53];

  let y = ML;

  // ── CABECERA ──
  // Fondo oscuro
  doc.setFillColor(...DARK);
  doc.rect(0, 0, PW, 42, 'F');

  // Ícono marca
  doc.setFillColor(...GOLD);
  doc.roundedRect(ML, y, 12, 12, 2, 2, 'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(8);
  doc.setTextColor(6,9,26);
  doc.text('DT', ML+2.5, y+7.5);

  // Nombre
  doc.setTextColor(232,184,75);
  doc.setFont('helvetica','bold');
  doc.setFontSize(16);
  doc.text('DividendTracker', ML+16, y+7);
  doc.setFontSize(7);
  doc.setTextColor(...MGRAY);
  doc.setFont('helvetica','normal');
  doc.text('INVERSIONES DIVIDENDERAS', ML+16, y+11.5);

  // Año y título (derecha)
  doc.setTextColor(...GOLD);
  doc.setFont('helvetica','bold');
  doc.setFontSize(26);
  doc.text(String(yr), PW-MR, y+9, {align:'right'});
  doc.setFontSize(8);
  doc.setTextColor(...MGRAY);
  doc.setFont('helvetica','normal');
  doc.text('INFORME ANUAL DE DIVIDENDOS', PW-MR, y+13.5, {align:'right'});
  doc.setFontSize(7);
  doc.text(`Generado el ${fechaStr}`, PW-MR, y+17.5, {align:'right'});

  y = 46;

  // ── KPIs ──
  const kpis=[
    {l:'Dividendos Brutos',     v:$(Math.round(totD)),   c:GREEN},
    {l:'Comisiones de Custodia',v:$(Math.round(totC)),   c:RED},
    {l:'Dividendo Neto',        v:$(Math.round(totD-totC)),c:GOLD},
    {l:'Yield on Cost',         v:pct(yoc),              c:BLUE},
  ];
  const kW=(CW-9)/4;
  kpis.forEach((k,i)=>{
    const kx=ML+i*(kW+3);
    doc.setFillColor(...GRAY);
    doc.roundedRect(kx, y, kW, 18, 2, 2, 'F');
    // borde superior color
    doc.setFillColor(...k.c);
    doc.roundedRect(kx, y, kW, 1.5, 0.5, 0.5, 'F');
    doc.setFontSize(6.5);
    doc.setTextColor(...MGRAY);
    doc.setFont('helvetica','normal');
    doc.text(k.l.toUpperCase(), kx+3, y+6.5);
    doc.setFontSize(11);
    doc.setTextColor(...k.c);
    doc.setFont('helvetica','bold');
    doc.text(k.v, kx+3, y+13.5);
  });
  y += 24;

  // ── HELPER para secciones ──
  function sectionTitle(title){
    doc.setFontSize(7.5);
    doc.setFont('helvetica','bold');
    doc.setTextColor(...MGRAY);
    doc.text(title.toUpperCase(), ML, y+4);
    doc.setDrawColor(...LGRAY);
    doc.setLineWidth(0.4);
    doc.line(ML, y+5.5, ML+CW, y+5.5);
    y += 10;
  }

  function addTable(head, body, foot){
    doc.autoTable({
      startY: y,
      head: [head],
      body: body,
      foot: foot ? [foot] : undefined,
      margin:{left:ML, right:MR},
      tableWidth: CW,
      styles:{fontSize:8.5, cellPadding:3, textColor:TEXT, font:'helvetica'},
      headStyles:{fillColor:GRAY, textColor:MGRAY, fontSize:7, fontStyle:'bold', halign:'left'},
      footStyles:{fillColor:GRAY, textColor:TEXT, fontSize:8.5, fontStyle:'bold'},
      columnStyles:{},
      alternateRowStyles:{fillColor:[252,253,255]},
      didParseCell(data){
        if(data.section==='foot') data.cell.styles.textColor = GREEN;
      }
    });
    y = doc.lastAutoTable.finalY + 8;
  }

  // ── RESUMEN MENSUAL ──
  sectionTitle('Resumen Mensual');
  const mesBody = Array.from({length:12},(_,i)=>{
    const mo=i+1, v=byMes[mo]||0;
    const comm=fComms.find(c=>c.mo===mo);
    if(!v && !comm) return null;
    return [MOF[i], v?$(Math.round(v)):'—', comm?$(Math.round(comm.amt)):'—', v?$(Math.round(v-(comm?comm.amt:0))):'—'];
  }).filter(Boolean);
  addTable(
    ['Mes','Dividendo Bruto','Comisión','Dividendo Neto'],
    mesBody,
    [`Total ${yr}`, $(Math.round(totD)), $(Math.round(totC)), $(Math.round(totD-totC))]
  );

  // ── NUEVA PÁGINA si queda poco espacio ──
  if(y > PH-70){ doc.addPage(); y=ML; }

  // ── POR INSTRUMENTO ──
  sectionTitle('Dividendos por Instrumento');
  const nemoBody = byNemoArr.map(([nemo,amt])=>[
    nemo, $(Math.round(amt)), totD>0?((amt/totD)*100).toFixed(1)+'%':'—'
  ]);
  addTable(
    ['Instrumento','Total Recibido','% del Total'],
    nemoBody,
    ['Total', $(Math.round(totD)), '100%']
  );

  if(y > PH-70){ doc.addPage(); y=ML; }

  // ── DETALLE ──
  sectionTitle('Detalle de Dividendos Recibidos');
  const detBody = fDivs.map(d=>[MOF[d.mo-1], d.nemo, $(d.amt,2)]);
  addTable(
    ['Mes','Instrumento','Monto Recibido'],
    detBody,
    [`Total ${yr}`, '', $(Math.round(totD))]
  );

  // ── PIE DE PÁGINA ──
  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setFontSize(7);
    doc.setTextColor(...MGRAY);
    doc.setFont('helvetica','normal');
    doc.text('Informe de uso personal — DividendTracker', ML, PH-8);
    doc.setTextColor(...GOLD);
    doc.setFont('helvetica','bold');
    doc.text(`Pág. ${i} / ${pageCount}`, PW-MR, PH-8, {align:'right'});
  }

  doc.save(`DividendTracker_Informe_${yr}.pdf`);
}


function toggleReinv(){
  PROJ.reinv=!PROJ.reinv;
  const col=PROJ.reinv?'var(--gold)':'var(--border)';
  const bg=PROJ.reinv?'var(--gold)':'transparent';
  el('reinv-row').style.borderColor=col;
  el('chk-box').style.borderColor=col;
  el('chk-box').style.background=bg;
  el('chk-box').textContent=PROJ.reinv?'✓':'';
  el('chk-lbl').style.color=PROJ.reinv?'var(--gold)':'var(--muted)';
  updateProj();
}

// ── TABS & HEADER ─────────────────────────────────────────────────────────────
function updateHeader(){
  const totD=DIVS.reduce((s,d)=>s+d.amt,0);
  el('header-total').textContent=$(Math.round(totD));
}

function switchTab(tab){
  CUR_TAB=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+tab));
  if(tab==='dashboard') renderDashboard();
  else if(tab==='portfolio') renderPortfolio();
  else if(tab==='dividends') renderDividends();
  else if(tab==='calendar') renderCalendar();
  else if(tab==='projection') renderProjection();
}

document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

function render(){
  updateHeader();
  renderDashboard(); // siempre actualizado
  if(CUR_TAB==='portfolio')  renderPortfolio();
  else if(CUR_TAB==='dividends')  renderDividends();
  else if(CUR_TAB==='calendar')   renderCalendar();
  else if(CUR_TAB==='projection') renderProjection();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function buildYearlyData(years){
  const data={};
  years.forEach(yr=>{
    data[yr]=Array(12).fill(0);
    DIVS.filter(d=>d.yr===yr).forEach(d=>{ data[yr][d.mo-1]+=d.amt; });
    data[yr]=data[yr].map(v=>Math.round(v));
  });
  return data;
}
render();
</script>
</body>
</html>
